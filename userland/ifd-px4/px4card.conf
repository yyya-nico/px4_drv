# PX4 Smart Card Reader configuration for pcscd
# Place this file in /etc/reader.conf.d/

# PX4/PX5
FRIENDLYNAME "PX4 Smart Card Reader #0"
DEVICENAME   /dev/px4card0
LIBPATH      /usr/lib/pcsc/drivers/ifd-px4.bundle/Contents/Linux/libpx4ifd.so
CHANNELID    0x000000

# PX-MLT5
FRIENDLYNAME "PX-MLT5 Smart Card Reader #0"
DEVICENAME   /dev/pxmlt5card0
LIBPATH      /usr/lib/pcsc/drivers/ifd-px4.bundle/Contents/Linux/libpx4ifd.so
CHANNELID    0x000001

# PX-MLT8
FRIENDLYNAME "PX-MLT8 Smart Card Reader #0"
DEVICENAME   /dev/pxmlt8card0
LIBPATH      /usr/lib/pcsc/drivers/ifd-px4.bundle/Contents/Linux/libpx4ifd.so
CHANNELID    0x000002

# ISDB2056
FRIENDLYNAME "ISDB2056 Smart Card Reader #0"
DEVICENAME   /dev/isdb2056card0
LIBPATH      /usr/lib/pcsc/drivers/ifd-px4.bundle/Contents/Linux/libpx4ifd.so
CHANNELID    0x000003

# Add more readers as needed...
# Examples: /dev/isdb6014card0, /dev/pxm1urcard0, /dev/pxs1urcard0, /dev/isdbt2071card0
# For each reader, use a unique CHANNELID
