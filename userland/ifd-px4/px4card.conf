# PX4 Smart Card Reader configuration for pcscd
# Place this file in /etc/reader.conf.d/
#
# Option A: auto (recommended)
#   DEVICENAME "/dev/null" -- ifdhandler scans /dev/px4card*, /dev/pxmlt*card*, etc.
#   and opens the first device it finds.
#   Works for any supported device without editing this file.
#
# Option B: explicit (for multiple devices of the same type or fixed assignment)
#   Set DEVICENAME to the exact device node, e.g. /dev/px4card0.

# Auto-detection (recommended: works for any single supported device)
FRIENDLYNAME      "PX4 Smart Card Reader (auto)"
DEVICENAME        /dev/null
LIBPATH           /usr/lib/pcsc/drivers/ifd-px4/Contents/Linux/libpx4ifd.so

# --- Explicit entries (use instead of auto when multiple devices are present) ---

# PX4/PX5
# FRIENDLYNAME      "PX4 Smart Card Reader"
# DEVICENAME        /dev/px4card0
# LIBPATH           /usr/lib/pcsc/drivers/ifd-px4/Contents/Linux/libpx4ifd.so

# PX-MLT5
# FRIENDLYNAME      "PX-MLT5 Smart Card Reader"
# DEVICENAME        /dev/pxmlt5card0
# LIBPATH           /usr/lib/pcsc/drivers/ifd-px4/Contents/Linux/libpx4ifd.so

